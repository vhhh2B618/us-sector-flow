name: Hourly US sector-flow refresh

on:
  workflow_dispatch:
  schedule:
    # First publish ~10:00 ET (EDT) / ~09:00 ET (EST): skip the thin 09:30 ET bar.
    # EST 14–21 UTC, EDT 14–20 UTC → 14–21 UTC weekdays. Thin/holiday skipped by publish_static.
    - cron: '0 14-21 * * 1-5'

permissions:
  contents: write

concurrency:
  group: us-sector-flow-hourly
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install deps
        run: pip install -r pipeline/requirements.txt

      - name: Fetch + rebuild static Pages files
        id: publish
        run: |
          set +e
          python pipeline/publish_static.py
          code=$?
          if [ "$code" -eq 78 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "SKIP: no usable RTH session (holiday/empty) — leaving Pages unchanged"
            exit 0
          fi
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Commit and push if changed
        if: steps.publish.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sector_flow.json sector_flow.csv
          if git diff --staged --quiet; then
            echo "No file changes to commit"
            exit 0
          fi
          git commit -m "chore: refresh sector flow snapshot"
          git push
